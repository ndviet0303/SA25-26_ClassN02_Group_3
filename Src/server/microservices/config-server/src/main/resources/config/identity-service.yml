# Identity Service Configuration
server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/identitydb
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: rabbitmq

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

jwt:
  secret: nozie-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
  expiration: 86400000 # 24 hours
