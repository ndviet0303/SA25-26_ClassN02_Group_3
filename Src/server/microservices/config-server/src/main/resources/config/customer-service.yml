# Customer Service Configuration (Docker/Production overrides)

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/customerdb
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  rabbitmq:
    host: rabbitmq

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
