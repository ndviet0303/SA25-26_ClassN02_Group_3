# Payment Service Configuration (Docker/Production overrides)
# This file is served by Config Server and overrides application.yml defaults

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/paymentdb
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: rabbitmq

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
