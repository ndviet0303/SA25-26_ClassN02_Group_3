    search:
      hint: Tìm kiếm
      noResults: Không tìm thấy câu hỏi phù hợp
    filter:
      clear: Xoá
    faq:
      general:
        whatIsNozie:
          question: Nozie là gì?
          answer: Nozie là trung tâm cá nhân giúp bạn khám phá, đọc và nghe sách. Dễ dàng duyệt gợi ý tuyển chọn, sắp xếp thư viện và đồng bộ trên mọi thiết bị.
        syncProgress:
          question: Làm sao đồng bộ tiến độ đọc trên nhiều thiết bị?
          answer: Đảm bảo bạn đã đăng nhập trên tất cả thiết bị. Tiến độ sẽ tự đồng bộ khi có kết nối; hãy kéo để làm mới trong tab Thư viện nếu muốn đồng bộ ngay.
        formatsSupport:
          question: Nozie hỗ trợ định dạng nào?
          answer: Nozie hỗ trợ tệp EPUB, PDF và audiobook MP3. Các tệp cá nhân tải lên sẽ được chuyển đổi tự động để phát tốt nhất.
      service:
        purchaseEbook:
          question: Làm thế nào để mua ebook?
          answer: Mở trang chi tiết sách, nhấn "Mua", chọn phương thức thanh toán rồi xác nhận. Sách đã mua sẽ xuất hiện ngay trong tab Thư viện.
        audiobookNotPlaying:
          question: Vì sao audiobook không phát?
          answer: Kiểm tra âm lượng thiết bị và kết nối ổn định. Nếu vẫn lỗi, hãy xóa bộ nhớ đệm tại Hồ sơ > Trung tâm trợ giúp rồi khởi động lại ứng dụng.
        manageNotifications:
          question: Quản lý thông báo như thế nào?
          answer: Vào Hồ sơ > Cài đặt thông báo để bật hoặc tắt cảnh báo cho gợi ý, mua sắm, khuyến mãi và nhiều loại khác.
        requestRefund:
          question: Làm sao yêu cầu hoàn tiền?
          answer: Liên hệ hỗ trợ qua Trung tâm trợ giúp > Liên hệ, cung cấp mã đơn hàng và đội ngũ của chúng tôi sẽ phản hồi trong 24 giờ.
        purchaseEbookIssue:
          question: "Tại sao tôi không thể mua ebook?"
          answer: Kiểm tra bạn đã thêm phương thức thanh toán hợp lệ và có kết nối ổn định. Nếu vẫn không được, hãy đăng xuất rồi đăng nhập lại trước khi thử mua.
        downloadEbookIssue:
          question: "Tại sao tôi không tải được ebook?"
          answer: Đảm bảo bạn đã mua tựa sách và còn đủ dung lượng lưu trữ. Việc tải xuống cần Wi-Fi trừ khi bạn bật tải bằng dữ liệu di động trong phần Tùy chỉnh.
      account:
        addPaymentMethod:
          question: Làm sao thêm phương thức thanh toán?
          answer: Vào Hồ sơ > Phương thức thanh toán, chọn "Thêm mới", nhập thông tin thẻ hoặc ví rồi lưu. Bạn có thể quản lý hoặc xóa bất cứ lúc nào tại đây.
        resetPassword:
          question: Làm sao đặt lại mật khẩu?
          answer: Vào Đăng nhập > Quên mật khẩu, nhập email và làm theo bước xác minh. Bạn có thể đặt mật khẩu mới sau khi xác nhận OTP gửi đến hộp thư.
        changeLanguage:
          question: Làm sao đổi ngôn ngữ ứng dụng?
          answer: Chuyển đến Hồ sơ > Ngôn ngữ để chọn ngôn ngữ mong muốn. Cài đặt sẽ áp dụng tức thì trên toàn ứng dụng.
        deleteAccount:
          question: Làm sao xóa tài khoản?
          answer: Mở Cài đặt > Bảo mật > Xóa tài khoản. Thực hiện các bước xác minh danh tính để hoàn tất.
        addPaymentMethodIssue:
          question: "Tại sao tôi không thêm được phương thức thanh toán?"
          answer: Hãy kiểm tra thông tin thẻ chính xác và được hỗ trợ ở khu vực của bạn. Một số thẻ trả trước hoặc ví điện tử có thể bị hạn chế bởi ngân hàng hoặc quốc gia.
      ebook:
        downloadOffline:
          question: Làm sao tải ebook để đọc offline?
          answer: Mở bất kỳ sách đã mua nào, nhấn biểu tượng tải xuống và chọn nơi lưu. Bản tải sẽ sẵn sàng offline trong tab Thư viện.
      movies:
        closeErabookAccount:
          question: "Tại sao tôi không thể đóng tài khoản trên Erabook?"
          answer: Nếu bạn đã liên kết Nozie với Erabook, hãy hủy liên kết tại Hồ sơ > Dịch vụ liên kết trước. Sau đó gửi yêu cầu đóng tài khoản từ bảng điều khiển Erabook.
