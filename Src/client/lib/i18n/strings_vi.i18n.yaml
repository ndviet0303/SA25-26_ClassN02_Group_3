welcome:
  title: "Chào mừng đến với NoZie 👋"
  titlePrefix: "Chào mừng đến với "
  description: Người bạn đồng hành phim của bạn. Nhận gợi ý cá nhân hóa, khám phá phim mới và theo dõi danh sách xem của bạn.
  getStarted: Bắt đầu
  continueWithGoogle: Tiếp tục với Google
  iAlreadyHaveAnAccount: Tôi đã có tài khoản
  
